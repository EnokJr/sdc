*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#080c14;color:#e8eaf0;min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#0f1117}::-webkit-scrollbar-thumb{background:#2a2f3e;border-radius:2px}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes orb{0%,100%{transform:scale(1) translate(0,0)}33%{transform:scale(1.08) translate(10px,-8px)}66%{transform:scale(.95) translate(-8px,6px)}}
.fade-in{animation:fadeIn .5s ease both}
.app-card{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#0f1525 0%,#111827 100%);
  border:1px solid #1e2540;
  border-radius:20px;padding:28px 24px;cursor:pointer;
  transition:transform .2s,border-color .2s,box-shadow .2s;
  text-decoration:none;display:block;
}
.app-card:hover{transform:translateY(-4px);box-shadow:0 16px 48px rgba(0,0,0,.5)}
.app-card.sdc:hover{border-color:#1D9E7566;box-shadow:0 16px 48px rgba(29,158,117,.15)}
.app-card.forjadora:hover{border-color:#EF9F2766;box-shadow:0 16px 48px rgba(239,159,39,.15)}
.app-card.future:hover{border-color:#6ea8fe44;box-shadow:0 16px 48px rgba(110,168,254,.1)}
.app-card::before{
  content:'';position:absolute;inset:0;opacity:0;
  transition:opacity .3s;
  background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.04),transparent 70%);
}
.app-card:hover::before{opacity:1}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.5px;text-transform:uppercase}
.tag.live{background:#1D9E7520;color:#1D9E75;border:1px solid #1D9E7540}
.tag.soon{background:#6ea8fe15;color:#6ea8fe99;border:1px solid #6ea8fe25}
.tag.beta{background:#EF9F2720;color:#EF9F27;border:1px solid #EF9F2740}

// ── Card de app ──
function AppCard({ app, user, onOpen }) {
  const isLive = !!app.url;
  const storageKey = `sys_access_${app.id}_${user?.email || "anon"}`;
  const [accessInfo, setAccessInfo] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem(storageKey)); } catch(e) { return null; }
  });

  const handleOpen = () => {
    if (!isLive) return;
    const now = new Date().toISOString();
    const info = { first: accessInfo?.first || now, last: now, count: (accessInfo?.count || 0) + 1 };
    try { localStorage.setItem(storageKey, JSON.stringify(info)); } catch(e) {}
    setAccessInfo(info);
    onOpen(app);
  };

  const fmtDate = iso => {
    const d = new Date(iso);
    return d.toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit", year:"2-digit" });
  };

  return React.createElement("div", {
    className: `app-card ${app.id}`,
    onClick: handleOpen,
    style: { opacity: isLive ? 1 : 0.55 }
  },
    // Glow de cor no canto
    React.createElement("div", { style:{
      position:"absolute", top:-40, right:-40, width:120, height:120,
      borderRadius:"50%",
      background:`radial-gradient(circle,${app.cor}20 0%,transparent 70%)`,
      pointerEvents:"none"
    }}),

    // Header do card
    React.createElement("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:16 } },
      React.createElement("div", { style:{
        width:48, height:48, borderRadius:14, fontSize:22,
        display:"flex", alignItems:"center", justifyContent:"center",
        background: app.corBg, border:`1px solid ${app.cor}30`,
        overflow:"hidden"
      }},
        app.icon && app.icon.startsWith("data:")
          ? React.createElement("img", { src: app.icon, style:{ width:48, height:48, borderRadius:14, objectFit:"cover" } })
          : app.icon
      ),
      React.createElement("span", { className:`tag ${app.tag}` }, app.tagLabel)
    ),

    // Nome e sigla
    React.createElement("div", { style:{ marginBottom:8 } },
      React.createElement("div", { style:{ fontSize:11, color: app.cor, fontWeight:700, letterSpacing:2, textTransform:"uppercase", marginBottom:4 } }, app.sigla),
      React.createElement("div", { style:{ fontSize:18, fontWeight:700, color:"#e8eaf0", letterSpacing:-0.3 } }, app.nome)
    ),

    // Descrição
    React.createElement("p", { style:{ fontSize:13, color:"#5a6478", lineHeight:1.55, marginBottom: app.atalhos.length ? 16 : 0 } }, app.desc),

    // Atalhos
    app.atalhos.length > 0 && React.createElement("div", { style:{ display:"flex", flexWrap:"wrap", gap:6 } },
      ...app.atalhos.map(a => React.createElement("span", { key:a, style:{
        fontSize:11, padding:"3px 9px", borderRadius:20,
        background:"rgba(255,255,255,.04)", color:"#3d4a60", border:"1px solid #1e2540"
      }}, a))
    ),

    // Rodapé — histórico de acesso
    isLive && React.createElement("div", { style:{
      marginTop:18, paddingTop:14, borderTop:"1px solid #1a2030",
      display:"flex", alignItems:"center", justifyContent:"space-between", fontSize:11, color:"#2d3a52"
    }},
      React.createElement("div", { style:{ display:"flex", alignItems:"center", gap:6 } },
        React.createElement("span", { style:{ width:6, height:6, borderRadius:"50%", background: accessInfo ? "#1D9E75" : "#2d3a52", flexShrink:0, display:"inline-block" }}),
        accessInfo
          ? React.createElement("span", null, "Último acesso ", React.createElement("span", { style:{color:"#4a5568"} }, fmtDate(accessInfo.last)))
          : React.createElement("span", { style:{color:"#EF9F27", fontWeight:600} }, "✦ Primeiro acesso")
      ),
      accessInfo && React.createElement("span", { style:{color:"#2a3244"} }, accessInfo.count, "x acessado")
    )
  );
}

// ── Hub principal ──
function Hub({ user, onLogout }) {
  const [launching, setLaunching] = useState(null);

  const openApp = (app) => {
    setLaunching(app.id);
    // Pequeno delay para feedback visual, depois abre na mesma aba
    setTimeout(() => {
      window.location.href = app.url;
    }, 350);
  };

  const firstName = user.displayName?.split(" ")[0] || user.email?.split("@")[0] || "Sheyla";
  const avatar = user.photoURL;
  const hora = new Date().getHours();
  const greeting = hora < 12 ? "Bom dia" : hora < 18 ? "Boa tarde" : "Boa noite";

  return React.createElement("div", {
    style: { minHeight:"100vh", background:"#080c14", padding:"0 0 60px" }
  },
    // Header
    React.createElement("div", { style:{
      padding:"20px 24px", display:"flex", justifyContent:"space-between", alignItems:"center",
      borderBottom:"1px solid #0f1525",
      background:"rgba(8,12,20,.95)", backdropFilter:"blur(12px)",
      position:"sticky", top:0, zIndex:50

// ── App principal ──
function App() {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [loginLoading, setLoginLoading] = useState(false);

  useEffect(() => {
    if (!_auth) { setLoading(false); return; }
    const unsub = _auth.onAuthStateChanged(u => {
      setUser(u);
      setLoading(false);
    });
    return unsub;
  }, []);

  const [previewMode, setPreviewMode] = useState(false);

  const handleLogin = async () => {
    if (!_auth) { setPreviewMode(true); return; }
    setLoginLoading(true);
    try {
      await _auth.signInWithPopup(_provider);
    } catch(e) {
      if (e.code === "auth/popup-blocked") {
        try { await _auth.signInWithRedirect(_provider); } catch(e2) { setPreviewMode(true); }
      } else {
        // Ambiente não suportado (file://, iframe, etc) → entra em preview
        setPreviewMode(true);
      }
      setLoginLoading(false);
    }
  };

  const handleLogout = async () => {
    if (previewMode) { setPreviewMode(false); return; }
    if (!confirm("Sair da conta Google?\n\nVocê precisará fazer login novamente para acessar os apps.")) return;
    await _auth.signOut();
  };

  // Modo preview: Firebase indisponível ou ambiente restrito
  const isPreview = !_auth || previewMode;
  const previewUser = { displayName: "Sheyla", email: "sheyla@example.com", photoURL: null };

  if (loading && !isPreview) return React.createElement("div", {
    style:{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:"#080c14" }
  },
    React.createElement("div", { style:{ fontSize:13, color:"#2d3a52", animation:"pulse 1s infinite" } }, "✦")
  );

  if (!user && !isPreview) return React.createElement(LoginScreen, { onLogin: handleLogin, loading: loginLoading });

  return React.createElement(Hub, { user: user || previewUser, onLogout: handleLogout, isPreview });
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
